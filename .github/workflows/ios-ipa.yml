name: Build unsigned iPhone app

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Create the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: ios

      - name: Turn off code signing so Sideloadly can sign it
        run: |
          ruby -e '
            require "xcodeproj"
            Dir["ios/**/*.xcodeproj"].each do |path|
              project = Xcodeproj::Project.open(path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["DEVELOPMENT_TEAM"] = ""
                end
              end
              project.save
            end
          '

      - name: Compile an unsigned iPhone app
        run: |
          set -euo pipefail

          # Prefer the CocoaPods workspace at ios/*.xcworkspace, not the nested project.xcworkspace.
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          if [ -z "${WORKSPACE}" ]; then
            WORKSPACE=$(find ios -name "*.xcworkspace" -not -path "*/project.xcworkspace" | head -n 1)
          fi
          if [ -z "${WORKSPACE}" ]; then
            echo "No iOS workspace found after prebuild."
            exit 1
          fi
          echo "Using workspace: ${WORKSPACE}"

          xcodebuild -workspace "${WORKSPACE}" -list

          # Trim the leading spaces Xcode prints before scheme names.
          SCHEME=$(
            xcodebuild -workspace "${WORKSPACE}" -list \
              | awk '/Schemes:/{flag=1; next} flag && NF{gsub(/^[ \t]+|[ \t]+$/,""); print; exit}'
          )
          if [ -z "${SCHEME}" ]; then
            echo "No scheme found in ${WORKSPACE}."
            exit 1
          fi
          echo "Using scheme: [${SCHEME}]"

          ARCHIVE="${RUNNER_TEMP}/StageCover.xcarchive"
          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

          APP=$(find "${ARCHIVE}/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "${APP}" ]; then
            echo "Archive finished, but no .app was produced."
            exit 1
          fi

          rm -rf "${RUNNER_TEMP}/Payload"
          mkdir -p "${RUNNER_TEMP}/Payload"
          cp -R "${APP}" "${RUNNER_TEMP}/Payload/"
          cd "${RUNNER_TEMP}"
          zip -r -y "${GITHUB_WORKSPACE}/StageCover-unsigned.ipa" Payload

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: StageCover-unsigned-ipa
          path: StageCover-unsigned.ipa
          if-no-files-found: error
