name: Build unsigned iPhone app

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Create the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: ios

      - name: Turn off code signing so Sideloadly can sign it
        run: |
          ruby -e '
            require "xcodeproj"
            Dir["ios/**/*.xcodeproj"].each do |path|
              project = Xcodeproj::Project.open(path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["DEVELOPMENT_TEAM"] = ""
                end
              end
              project.save
            end
          '

      - name: Compile an unsigned iPhone app
        run: |
          set -euo pipefail

          # Prefer the CocoaPods workspace at ios/*.xcworkspace, not the nested project.xcworkspace.
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          if [ -z "${WORKSPACE}" ]; then
            WORKSPACE=$(find ios -name "*.xcworkspace" -not -path "*/project.xcworkspace" | head -n 1)
          fi
          if [ -z "${WORKSPACE}" ]; then
            echo "No iOS workspace found after prebuild."
            exit 1
          fi
          echo "Using workspace: ${WORKSPACE}"

          xcodebuild -workspace "${WORKSPACE}" -list

          # Prefer the app scheme (StageCover). Do not take the first listed scheme —
          # CocoaPods also lists library schemes like "boost".
          SCHEMES=$(
            xcodebuild -workspace "${WORKSPACE}" -list \
              | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag{gsub(/^[ \t]+|[ \t]+$/,""); if (NF) print}'
          )
          echo "Available schemes:"
          echo "${SCHEMES}"

          SCHEME=$(echo "${SCHEMES}" | awk '/^StageCover$/{print; found=1; exit} END{if(!found) exit 1}') \
            || SCHEME=$(echo "${SCHEMES}" | head -n 1)

          if [ -z "${SCHEME}" ] || [ "${SCHEME}" = "boost" ]; then
            echo "Could not find the StageCover app scheme."
            exit 1
          fi
          echo "Using scheme: [${SCHEME}]"

          DERIVED="${RUNNER_TEMP}/DerivedData"
          ARCHIVE="${RUNNER_TEMP}/StageCover.xcarchive"

          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${DERIVED}" \
            -archivePath "${ARCHIVE}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

          echo "Archive tree:"
          find "${ARCHIVE}" -maxdepth 4 -print || true

          APP=$(find "${ARCHIVE}" -name "*.app" -type d | head -n 1 || true)
          if [ -z "${APP}" ]; then
            echo "Archive had no .app. Falling back to DerivedData Release build product."
            APP=$(find "${DERIVED}/Build/Products" -path "*/Release-iphoneos/*.app" -type d | head -n 1 || true)
          fi
          if [ -z "${APP}" ]; then
            echo "No .app found after archive."
            find "${DERIVED}/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi
          echo "Using app: ${APP}"

          rm -rf "${RUNNER_TEMP}/Payload"
          mkdir -p "${RUNNER_TEMP}/Payload"
          cp -R "${APP}" "${RUNNER_TEMP}/Payload/"
          cd "${RUNNER_TEMP}"
          zip -r -y "${GITHUB_WORKSPACE}/StageCover-unsigned.ipa" Payload
          ls -lh "${GITHUB_WORKSPACE}/StageCover-unsigned.ipa"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: StageCover-unsigned-ipa
          path: StageCover-unsigned.ipa
          if-no-files-found: error
