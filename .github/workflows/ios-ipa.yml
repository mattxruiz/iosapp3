name: Build unsigned iPhone app

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Bump this if a warm cache ever looks broken.
      # Bump when app.json plugins / native config change so prebuild is not skipped on a bad cache.
      CACHE_EPOCH: v9
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      # Same key for ios/ and DerivedData on purpose. Restoring one without the
      # other is often slower than a cold build.
      - name: Restore iOS + DerivedData cache
        id: ios-cache
        uses: actions/cache@v4
        with:
          path: |
            ios
            .cache/DerivedData
            ~/Library/Caches/CocoaPods
          key: ${{ env.CACHE_EPOCH }}-${{ runner.os }}-ios-${{ hashFiles('package-lock.json', 'package.json', 'app.json', 'eas.json') }}

      - name: Create the iOS project
        if: steps.ios-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        if: steps.ios-cache.outputs.cache-hit != 'true'
        run: pod install
        working-directory: ios

      - name: Refresh pods when cache hit
        if: steps.ios-cache.outputs.cache-hit == 'true'
        run: pod install --deployment || pod install
        working-directory: ios

      - name: Turn off code signing so Sideloadly can sign it
        run: |
          ruby -e '
            require "xcodeproj"
            Dir["ios/**/*.xcodeproj"].each do |path|
              project = Xcodeproj::Project.open(path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["DEVELOPMENT_TEAM"] = ""
                end
              end
              project.save
            end
          '

      - name: Compile an unsigned iPhone app
        run: |
          set -euo pipefail

          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          if [ -z "${WORKSPACE}" ]; then
            WORKSPACE=$(find ios -name "*.xcworkspace" -not -path "*/project.xcworkspace" | head -n 1)
          fi
          if [ -z "${WORKSPACE}" ]; then
            echo "No iOS workspace found after prebuild."
            exit 1
          fi
          echo "Using workspace: ${WORKSPACE}"

          SCHEMES=$(
            xcodebuild -workspace "${WORKSPACE}" -list \
              | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag{gsub(/^[ \t]+|[ \t]+$/,""); if (NF) print}'
          )
          SCHEME=$(echo "${SCHEMES}" | awk '/^BlacRec$/{print; found=1; exit} END{if(!found) exit 1}') \
            || SCHEME=$(echo "${SCHEMES}" | head -n 1)
          if [ -z "${SCHEME}" ] || [ "${SCHEME}" = "boost" ]; then
            echo "Could not find the BlacRec app scheme."
            exit 1
          fi
          echo "Using scheme: [${SCHEME}]"

          mkdir -p .cache/DerivedData
          DERIVED="${GITHUB_WORKSPACE}/.cache/DerivedData"
          ARCHIVE="${RUNNER_TEMP}/BlacRec.xcarchive"
          JOBS="$(sysctl -n hw.ncpu)"

          # Faster device Release build for sideload:
          # - arm64 only (iPhone 14)
          # - no compiler index store
          # - no dSYM packaging
          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${DERIVED}" \
            -archivePath "${ARCHIVE}" \
            -jobs "${JOBS}" \
            -parallelizeTargets \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            SWIFT_SUPPRESS_WARNINGS=YES \
            archive

          APP=$(find "${ARCHIVE}" -name "*.app" -type d | head -n 1 || true)
          if [ -z "${APP}" ]; then
            APP=$(find "${DERIVED}/Build/Products" -path "*/Release-iphoneos/*.app" -type d | head -n 1 || true)
          fi
          if [ -z "${APP}" ]; then
            echo "No .app found after archive."
            find "${ARCHIVE}" -maxdepth 5 -print || true
            find "${DERIVED}/Build/Products" -maxdepth 5 -print || true
            exit 1
          fi
          echo "Using app: ${APP}"

          rm -rf "${RUNNER_TEMP}/Payload"
          mkdir -p "${RUNNER_TEMP}/Payload"
          cp -R "${APP}" "${RUNNER_TEMP}/Payload/"
          cd "${RUNNER_TEMP}"
          zip -r -y "${GITHUB_WORKSPACE}/BlacRec-unsigned.ipa" Payload
          ls -lh "${GITHUB_WORKSPACE}/BlacRec-unsigned.ipa"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlacRec-unsigned-ipa
          path: BlacRec-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
